# Tests every pull request and every push to main. On main it also builds and publishes the image
# ghcr.io/nandminc/aw-study:main. When the green tick appears on the commit, press "Update from
# GitHub" at https://apps.pacificfish.ca and the server deploys exactly that image.
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  packages: write

concurrency: # a newer push cancels an older run of the same branch still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a normal run takes about 1 minute; a hang fails here instead of running for hours
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browsers the tests use: Chromium for desktop and Android, WebKit (Safari's engine) for iPhone
      # (it hung once on GitHub's side, Nov 18: if this step times out, rerun the job)
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8
      - run: npm test

  image:
    needs: test # a broken push never becomes an image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase: NandMinc/AW-Study -> ghcr.io/nandminc/aw-study
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # On a pull request the image is only built, to prove the Dockerfile works; on main it's published
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
