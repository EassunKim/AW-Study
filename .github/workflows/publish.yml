# Tests every pull request and every push to main. On main it also builds and publishes the image
# ghcr.io/nandminc/aw-study:main. When the green tick appears on the commit, press "Update from
# GitHub" at https://apps.pacificfish.ca and the server deploys exactly that image.
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  packages: write

concurrency: # a newer push cancels an older run of the same branch still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a normal run takes about 2 minutes; a hang fails here instead of running for hours
    # Playwright's own image: Chromium (desktop, Android) and WebKit (iPhone) and every system library
    # they need are already inside, so nothing is downloaded from Ubuntu's package mirrors (installing
    # them hung twice on Nov 18). Its version must equal @playwright/test's in package.json: when you
    # upgrade Playwright, change the tag here and in the check below.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the image matches the installed Playwright
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.65.1"
      - run: npm test

  image:
    needs: test # a broken push never becomes an image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase: NandMinc/AW-Study -> ghcr.io/nandminc/aw-study
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # On a pull request the image is only built, to prove the Dockerfile works; on main it's published
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
